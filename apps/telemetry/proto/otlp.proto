syntax = "proto3";

// A subset of the OpenTelemetry protocol, sufficient to receive logs and
// traces.
//
// Not the upstream files: only the messages and fields this service reads,
// with their field numbers copied exactly. Protobuf decoding is driven by
// field numbers and wire types, and unknown fields are skipped — so a subset
// with the right numbers decodes a full payload correctly, and keeps decoding
// it when the SDK adds a field. The alternative, vendoring six files and their
// imports, adds a thousand lines nobody reads and a sync problem nobody
// notices.
//
// Field numbers are from opentelemetry-proto v1 (Apache-2.0) and are stable by
// that specification's own compatibility guarantee. Anything absent here is
// deliberately ignored: dropped counts, trace state, schema URLs, flags.

package opentelemetry.proto;

// ---------- common ----------

message AnyValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    double double_value = 4;
    ArrayValue array_value = 5;
    KeyValueList kvlist_value = 6;
    bytes bytes_value = 7;
  }
}

message ArrayValue { repeated AnyValue values = 1; }
message KeyValueList { repeated KeyValue values = 1; }
message KeyValue {
  string key = 1;
  AnyValue value = 2;
}

message InstrumentationScope {
  string name = 1;
  string version = 2;
}

message Resource { repeated KeyValue attributes = 1; }

// ---------- logs ----------

message LogRecord {
  fixed64 time_unix_nano = 1;
  uint32 severity_number = 2;
  string severity_text = 3;
  AnyValue body = 5;
  repeated KeyValue attributes = 6;
  bytes trace_id = 9;
  bytes span_id = 10;
  fixed64 observed_time_unix_nano = 11;
}

message ScopeLogs {
  InstrumentationScope scope = 1;
  repeated LogRecord log_records = 2;
}

message ResourceLogs {
  Resource resource = 1;
  repeated ScopeLogs scope_logs = 2;
}

message ExportLogsServiceRequest { repeated ResourceLogs resource_logs = 1; }

message ExportLogsPartialSuccess {
  int64 rejected_log_records = 1;
  string error_message = 2;
}

message ExportLogsServiceResponse { ExportLogsPartialSuccess partial_success = 1; }

// ---------- traces ----------

message Status {
  string message = 2;
  uint32 code = 3;
}

message SpanEvent {
  fixed64 time_unix_nano = 1;
  string name = 2;
  repeated KeyValue attributes = 3;
}

message SpanLink {
  bytes trace_id = 1;
  bytes span_id = 2;
}

message Span {
  bytes trace_id = 1;
  bytes span_id = 2;
  string trace_state = 3;
  bytes parent_span_id = 4;
  string name = 5;
  uint32 kind = 6;
  fixed64 start_time_unix_nano = 7;
  fixed64 end_time_unix_nano = 8;
  repeated KeyValue attributes = 9;
  repeated SpanEvent events = 11;
  repeated SpanLink links = 13;
  Status status = 15;
}

message ScopeSpans {
  InstrumentationScope scope = 1;
  repeated Span spans = 2;
}

message ResourceSpans {
  Resource resource = 1;
  repeated ScopeSpans scope_spans = 2;
}

message ExportTraceServiceRequest { repeated ResourceSpans resource_spans = 1; }

message ExportTracePartialSuccess {
  int64 rejected_spans = 1;
  string error_message = 2;
}

message ExportTraceServiceResponse { ExportTracePartialSuccess partial_success = 1; }

// ---------- metrics ----------
//
// Field numbers again copied exactly. The two easy traps are here: a data
// point's attributes are field 7 on a number point and field 9 on a histogram
// point (field 1 held the deprecated string labels), and the value is a oneof
// between a double and a signed fixed integer.

message Exemplar {
  fixed64 time_unix_nano = 2;
  double as_double = 3;
  bytes span_id = 4;
  bytes trace_id = 5;
  sfixed64 as_int = 6;
}

message NumberDataPoint {
  fixed64 start_time_unix_nano = 2;
  fixed64 time_unix_nano = 3;
  repeated Exemplar exemplars = 5;
  repeated KeyValue attributes = 7;
  // A real oneof, not two optional fields: with defaults materialised, the
  // only way to know whether the sender meant 0.0 or 0 is the discriminator
  // protobufjs derives from the oneof declaration.
  oneof value {
    double as_double = 4;
    sfixed64 as_int = 6;
  }
}

message HistogramDataPoint {
  fixed64 start_time_unix_nano = 2;
  fixed64 time_unix_nano = 3;
  fixed64 count = 4;
  double sum = 5;
  repeated fixed64 bucket_counts = 6;
  repeated double explicit_bounds = 7;
  repeated Exemplar exemplars = 8;
  repeated KeyValue attributes = 9;
  double min = 11;
  double max = 12;
}

message Gauge { repeated NumberDataPoint data_points = 1; }

message Sum {
  repeated NumberDataPoint data_points = 1;
  uint32 aggregation_temporality = 2;
  bool is_monotonic = 3;
}

message Histogram {
  repeated HistogramDataPoint data_points = 1;
  uint32 aggregation_temporality = 2;
}

message Metric {
  string name = 1;
  string description = 2;
  string unit = 3;
  // Same reason as above, and a stronger one: without the oneof there is no
  // discriminator, every point type looks absent, and the decoder silently
  // returns nothing at all.
  oneof data {
    Gauge gauge = 5;
    Sum sum = 7;
    Histogram histogram = 9;
    // The exponential histogram and the summary are declared so the decoder
    // can see they were sent and say so, rather than skipping them.
    bytes exponential_histogram = 10;
    bytes summary = 11;
  }
}

message ScopeMetrics {
  InstrumentationScope scope = 1;
  repeated Metric metrics = 2;
}

message ResourceMetrics {
  Resource resource = 1;
  repeated ScopeMetrics scope_metrics = 2;
}

message ExportMetricsServiceRequest { repeated ResourceMetrics resource_metrics = 1; }

message ExportMetricsPartialSuccess {
  int64 rejected_data_points = 1;
  string error_message = 2;
}

message ExportMetricsServiceResponse { ExportMetricsPartialSuccess partial_success = 1; }

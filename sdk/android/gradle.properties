android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g

# The daemon's JVM is NOT set here on purpose. The Android Gradle Plugin does
# not support a JVM newer than 21, Homebrew's gradle launches on 25, and a path
# to one machine's JDK in a committed file is a file that breaks on every other
# machine. `demo/run.sh` finds a 17–21 JDK; set JAVA_HOME yourself otherwise.

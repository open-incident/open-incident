packages:
  - "apps/*"
  - "packages/*"
  - "ee/*"
# Build scripts pnpm asked about: esbuild installs its platform binary (tsx,
# vitest, drizzle-kit rely on it); msgpackr-extract is BullMQ's optional native
# accelerator. Both are allowed; a refusal would fail every install in CI.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
